<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who - MindWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' https: data:;
  connect-src 'self' https://editoramindwave.com.br https://api.bigdatacloud.net https://api.qrserver.com https://servicodados.ibge.gov.br;
  frame-src https://www.youtube.com https://open.spotify.com https://www.google.com https://calendly.com https://docs.google.com;
">
<link rel="apple-touch-icon" sizes="180x180" href="https://editoramindwave.com.br/api/libs/logos/icon2.png">
<link rel="icon" type="image/png" href="https://editoramindwave.com.br/api/libs/logos/icon1.png">
<link rel="manifest" href="/chrome.json">
</head>
<body>
  <div class="scene">
    <div class="prompt">
      <span class="dot"></span><span id="promptText">who://</span>
      <span class="lado-direito">
        <button class="tema-toggle" id="btnHome" type="button" title="voltar ao início" aria-label="voltar ao início" style="margin-right:6px;"></button>
        <button class="tema-toggle" id="btnMapa" type="button" title="empresas perto de você" aria-label="empresas perto de você" style="margin-right:6px;"></button>
        <button class="tema-toggle" id="btnBuscar" type="button" title="buscar perfis" aria-label="buscar perfis" style="margin-right:6px;"></button>
        <button class="tema-toggle" id="btnDenunciar" type="button" title="denunciar este perfil" aria-label="denunciar este perfil" style="margin-right:6px;"></button>
        <button class="tema-toggle" id="btnTema" type="button" title="alternar modo dia/noite" aria-label="alternar modo dia/noite"></button>
      </span>
    </div>
    <div class="card" id="card">
      <div class="state-box" id="stateBox">
        <div class="big">consultando…</div>
        procurando registro na base
      </div>
    </div>
    <div class="footer-tag">feito com ❤︎ <a href="https://editoramindwave.com.br" target="_blank" rel="noopener">mindwave</a> · <button class="btn-link-discreto" id="btnAbrirSuporte" type="button" style="text-decoration:underline;">suporte</button></div>
  </div>

  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-modal">
      <button class="fechar" id="popupFechar" type="button" aria-label="fechar">✕</button>
      <h2 id="popupTitulo"></h2>
      <div class="conteudo" id="popupConteudo"></div>
      <button class="btn-copiar" id="popupCopiar" type="button">copiar</button>
    </div>
  </div>

  <div class="popup-overlay" id="qrOverlay">
    <div class="popup-modal">
      <button class="fechar" id="qrFechar" type="button" aria-label="fechar">✕</button>
      <h2>seu QR code</h2>
      <img class="qr-img" id="qrImagem" alt="QR code do perfil">
      <a class="btn-copiar" id="qrBaixar" style="display:block;text-align:center;text-decoration:none;" download="qrcode.png">baixar imagem</a>
    </div>
  </div>

  <div class="popup-overlay" id="denunciaOverlay">
    <div class="popup-modal">
      <button class="fechar" id="denunciaFechar" type="button" aria-label="fechar">✕</button>
      <h2>denunciar perfil</h2>
      <div class="field">
        <label>motivo</label>
        <select id="denunciaMotivo" style="width:100%;border:1px solid var(--hairline);border-radius:10px;padding:10px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:#fff;color:var(--ink);">
          <option value="golpe_fraude">Golpe ou fraude (ex: PIX falso)</option>
          <option value="conteudo_impropio">Conteúdo impróprio</option>
          <option value="spam">Spam</option>
          <option value="perfil_falso">Perfil falso / se passando por outra pessoa</option>
          <option value="outro">Outro motivo</option>
        </select>
      </div>
      <div class="field">
        <label>detalhes (opcional)</label>
        <textarea id="denunciaDetalhes" rows="3" placeholder="conte um pouco mais, se quiser"></textarea>
      </div>
      <button class="btn-copiar" id="denunciaEnviar" type="button">enviar denúncia</button>
      <div class="save-msg" id="denunciaMsg"></div>
    </div>
  </div>

  <div class="popup-overlay" id="buscaOverlay">
    <div class="popup-modal">
      <button class="fechar" id="buscaFechar" type="button" aria-label="fechar">✕</button>
      <h2>buscar perfis</h2>
      <div class="field">
        <input type="text" id="buscaInput" placeholder="buscar por nome ou @usuário…">
      </div>
      <div class="field">
        <select id="buscaCategoria" style="width:100%;border:1px solid var(--hairline);border-radius:10px;padding:9px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#fff;color:var(--ink);">
          <option value="">todas as categorias</option>
        </select>
      </div>
      <div id="buscaResultados"></div>
      <div style="text-align:center;margin-top:12px;">
        <a href="busca.html" id="linkBuscaCompleta" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);text-decoration:underline;">ver todos os resultados →</a>
      </div>
    </div>
  </div>

  <div class="popup-overlay" id="mapaOverlay">
    <div class="popup-modal">
      <button class="fechar" id="mapaFechar" type="button" aria-label="fechar">✕</button>
      <h2>empresas perto de você</h2>
      <div class="field-row" style="margin-bottom:10px;">
        <div class="field" style="max-width:90px;">
          <label>estado</label>
          <select id="mapaEstado" style="width:100%;border:1px solid var(--hairline);border-radius:10px;padding:10px 8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;background:#fff;color:var(--ink);">
            <option value="">UF</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
            <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
            <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
            <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
            <option>SE</option><option>TO</option>
          </select>
        </div>
        <div class="field">
          <label>cidade (opcional)</label>
          <input type="text" id="mapaCidade" placeholder="ex: Campinas">
        </div>
      </div>
      <div class="field">
        <select id="mapaCategoria" style="width:100%;border:1px solid var(--hairline);border-radius:10px;padding:9px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#fff;color:var(--ink);">
          <option value="">Todas as Categorias</option>
        </select>
      </div>
      <button class="btn btn-add" id="btnUsarLocalizacao" type="button" style="width:100%;margin-bottom:10px;">usar minha localização</button>
      <button class="btn-copiar" id="mapaBuscarBtn" type="button">buscar empresas</button>
      <div class="save-msg" id="mapaMsg"></div>
      <div id="mapaResultados" style="margin-top:14px;"></div>
      <div style="text-align:center;margin-top:12px;">
        <a href="busca.html" id="linkBuscaCompletaMapa" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);text-decoration:underline;">ver todos os resultados →</a>
      </div>
    </div>
  </div>

  <div class="popup-overlay" id="suporteOverlay">
    <div class="popup-modal">
      <button class="fechar" id="suporteFechar" type="button" aria-label="fechar">✕</button>
      <h2>abrir chamado</h2>
      <div class="field">
        <label>seu nome</label>
        <input type="text" id="suporteNome" placeholder="seu nome">
      </div>
      <div class="field">
        <label>e-mail</label>
        <input type="email" id="suporteEmail" placeholder="voce@email.com">
      </div>
      <div class="field">
        <label>assunto</label>
        <input type="text" id="suporteAssunto" placeholder="ex: dúvida sobre meu perfil">
      </div>
      <div class="field">
        <label>mensagem</label>
        <textarea id="suporteMensagem" rows="3" placeholder="descreva o que você precisa"></textarea>
      </div>
      <button class="btn-copiar" id="suporteEnviar" type="button">enviar chamado</button>
      <div class="save-msg" id="suporteMsg"></div>
    </div>
  </div>

  <div class="popup-overlay" id="esqueciOverlay">
    <div class="popup-modal">
      <button class="fechar" id="esqueciFechar" type="button" aria-label="fechar">✕</button>
      <h2 id="esqueciTitulo">recuperar acesso</h2>
      <div class="field">
        <label>e-mail cadastrado</label>
        <input type="email" id="esqueciEmail" placeholder="voce@email.com">
      </div>
      <button class="btn-copiar" id="esqueciEnviar" type="button">enviar</button>
      <div class="save-msg" id="esqueciMsg"></div>
    </div>
  </div>

  <div class="popup-overlay" id="solicitarOverlay">
    <div class="popup-modal">
      <button class="fechar" id="solicitarFechar" type="button" aria-label="fechar">✕</button>
      <h2>solicitar acesso</h2>
      <div class="field">
        <label>@usuário desejado</label>
        <input type="text" id="solicitarSlug" placeholder="seu-usuario">
      </div>
      <div class="field">
        <label>seu nome / nome do negócio</label>
        <input type="text" id="solicitarTitulo" placeholder="ex: João Silva - Consultoria">
      </div>
      <div class="field">
        <label>e-mail de contato</label>
        <input type="email" id="solicitarEmail" placeholder="voce@email.com">
      </div>
      <div class="field">
        <label>mensagem (opcional)</label>
        <textarea id="solicitarMensagem" rows="2" placeholder="conte um pouco sobre você ou seu negócio"></textarea>
      </div>
      <button class="btn-copiar" id="solicitarEnviar" type="button">enviar solicitação</button>
      <div class="save-msg" id="solicitarMsg"></div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
