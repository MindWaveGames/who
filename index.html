<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who - MindWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C;
    --paper:#F7F5F1;
    --signal:#FF4F32;
    --accent:#FF4F32;
    --graphite:#6B6B70;
    --hairline:#2A2A2D;
    --ok:#3FA796;
    --like:#FF3B5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .scene{width:100%;max-width:420px;}
  .prompt{
    font-family:'IBM Plex Mono', monospace;font-size:13px;color:var(--graphite);
    display:flex;align-items:center;gap:8px;margin-bottom:18px;letter-spacing:0.02em;
  }
  .prompt .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0;
  }
  .card{
    background:var(--paper);color:var(--ink);border-radius:18px;
    padding:36px 28px 28px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg, var(--accent), transparent 70%);
  }
  .header-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .avatar{
    width:64px;height:64px;border-radius:50%;flex-shrink:0;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:22px;
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .header-text{min-width:0;}
  h1{
    font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:22px;
    line-height:1.2;margin:0 0 4px;
    overflow-wrap:break-word;
  }
  .handle{
    font-family:'IBM Plex Mono', monospace;font-size:13px;
    color:var(--accent);font-weight:500;
  }
  .bio{
    color:var(--graphite);font-size:14.5px;line-height:1.5;
    margin:0 0 22px;white-space:pre-line;
  }
  .like-btn{
    position:absolute;top:18px;right:18px;
    display:flex;align-items:center;gap:6px;
    background:rgba(0,0,0,0.04);
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:7px 12px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--graphite);
    transition:background .15s ease, color .15s ease, transform .1s ease;
    user-select:none;
  }
  .like-btn:active{transform:scale(0.94);}
  .like-btn.curtido{
    color:var(--like);
    border-color:var(--like);
    background:rgba(255,59,92,0.08);
  }
  .like-btn svg{width:15px;height:15px;flex-shrink:0;}
  .blocos{display:flex;flex-direction:column;gap:10px;}
  .link-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border:1px solid var(--hairline);border-radius:12px;
    text-decoration:none;color:var(--ink);background:transparent;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    font-weight:500;font-size:15px;
  }
  .link-row .label{display:flex;align-items:center;gap:10px;min-width:0;}
  .link-row .icone{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .link-row .icone svg{width:100%;height:100%;}
  .link-row:hover{
    background:var(--accent);color:var(--paper);border-color:var(--accent);
    transform:translateX(2px);
  }
  .link-row .arrow{font-family:'IBM Plex Mono', monospace;opacity:0.5;}
  .texto-bloco{
    padding:14px 16px;border:1px dashed var(--hairline);border-radius:12px;
    font-size:14px;line-height:1.5;color:var(--ink);white-space:pre-line;
    background:rgba(0,0,0,0.02);
  }
  .footer-tag{
    text-align:center;margin-top:22px;font-family:'IBM Plex Mono', monospace;
    font-size:11px;color:var(--graphite);letter-spacing:0.05em;
  }
  .footer-tag a{color:var(--graphite);}
  .state-box{
    text-align:center;padding:60px 20px;color:var(--graphite);
    font-family:'IBM Plex Mono', monospace;font-size:13px;
  }
  .state-box .big{
    font-family:'Space Grotesk', sans-serif;color:var(--paper);
    font-size:20px;margin-bottom:8px;
  }
  .edit-banner{
    display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--ink);
    font-family:'IBM Plex Mono', monospace;font-size:12px;font-weight:500;
    padding:8px 14px;border-radius:999px;margin-bottom:16px;width:fit-content;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-family:'IBM Plex Mono', monospace;font-size:11px;
    color:var(--graphite);margin-bottom:5px;text-transform:lowercase;
  }
  .field input, .field textarea{
    width:100%;border:1px solid var(--hairline);border-radius:10px;
    padding:10px 12px;font-family:'IBM Plex Sans', sans-serif;font-size:14px;
    color:var(--ink);background:#fff;resize:vertical;
  }
  .field input[type=color]{padding:4px;height:42px;cursor:pointer;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field-row{display:flex;gap:10px;align-items:flex-end;}
  .field-row .field{flex:1;margin-bottom:0;}
  .bloco-edit-item{border:1px solid var(--hairline);border-radius:10px;padding:10px;margin-bottom:8px;}
  .bloco-edit-item .tipo-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .link-edit-row{display:flex;gap:8px;}
  .link-edit-row input{flex:1;}
  .btn{
    font-family:'IBM Plex Mono', monospace;font-size:12px;border:none;
    border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;
  }
  .btn-remove{background:transparent;color:var(--graphite);border:1px solid var(--hairline);padding:0 12px;}
  .btn-add{background:transparent;color:var(--ink);border:1px dashed var(--hairline);width:100%;margin-top:4px;}
  .btn-add-row{display:flex;gap:8px;margin-top:4px;}
  .btn-add-row .btn-add{margin-top:0;}
  .btn-save{background:var(--ink);color:var(--paper);width:100%;margin-top:18px;padding:13px;font-size:13px;}
  .btn-save:disabled{opacity:0.5;cursor:default;}
  .save-msg{text-align:center;font-family:'IBM Plex Mono', monospace;font-size:12px;margin-top:10px;}
  .save-msg.ok{color:var(--ok);}
  .save-msg.err{color:var(--accent);}
  @media (prefers-reduced-motion: reduce){.link-row{transition:none;}}
</style>
</head>
<body>
  <div class="scene">
    <div class="prompt"><span class="dot"></span><span id="promptText">who://</span></div>
    <div class="card" id="card">
      <div class="state-box" id="stateBox">
        <div class="big">consultando…</div>
        procurando registro na base
      </div>
    </div>
    <div class="footer-tag">feito com ❤︎ <a href="https://editoramindwave.com.br" target="_blank" rel="noopener">mindwave</a></div>
  </div>

<script>
const API_BASE = 'https://editoramindwave.com.br/api';

function getSlugETokenDaURL() {
  const params = new URLSearchParams(window.location.search);
  const redirected = params.get('p');
  let path = redirected ? redirected : window.location.pathname;
  path = path.replace(/^\/+|\/+$/g, '');
  const slug = path.split('/')[0] || '';
  const token = params.get('token') || '';
  return { slug, token };
}

const { slug, token } = getSlugETokenDaURL();
const cardEl = document.getElementById('card');
const promptEl = document.getElementById('promptText');
promptEl.textContent = 'who://' + (slug || '…');

function iniciais(nome) {
  return (nome || '?').trim().split(/\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();
}

  instagram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.9.2 2.4.4.5.2.9.5 1.3.9.4.4.6.8.9 1.3.2.5.3 1.2.4 2.4.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.9-.4 2.4-.2.5-.5.9-.9 1.3-.4.4-.8.6-1.3.9-.5.2-1.2.3-2.4.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.9-.2-2.4-.4-.5-.2-.9-.5-1.3-.9-.4-.4-.6-.8-.9-1.3-.2-.5-.3-1.2-.4-2.4C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.9.4-2.4.2-.5.5-.9.9-1.3.4-.4.8-.6 1.3-.9.5-.2 1.2-.3 2.4-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1 .1-1.6.2-1.9.4-.5.2-.8.4-1.1.7-.3.3-.6.7-.7 1.1-.1.3-.3.9-.4 1.9-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1 .2 1.6.4 1.9.2.5.4.8.7 1.1.3.3.7.6 1.1.7.3.1.9.3 1.9.4 1.2.1 1.5.1 4.7.1s3.5 0 4.7-.1c1-.1 1.6-.2 1.9-.4.5-.2.8-.4 1.1-.7.3-.3.6-.7.7-1.1.1-.3.3-.9.4-1.9.1-1.2.1-1.5.1-4.7s0-3.5-.1-4.7c-.1-1-.2-1.6-.4-1.9-.2-.5-.4-.8-.7-1.1-.3-.3-.7-.6-1.1-.7-.3-.1-.9-.3-1.9-.4-1.2-.1-1.5-.1-4.7-.1zM12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zm5.2-8.4a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z"/></svg>`,
  youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.2-.4-4.7c-.2-.9-.9-1.6-1.8-1.8C18.3 5 12 5 12 5s-6.3 0-7.8.5c-.9.2-1.6.9-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.7c.2.9.9 1.6 1.8 1.8C5.7 19 12 19 12 19s6.3 0 7.8-.5c.9-.2 1.6-.9 1.8-1.8.4-1.5.4-4.7.4-4.7zM10 15.5v-7l6 3.5-6 3.5z"/></svg>`,

  x: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 3H21l-6.6 7.5L22 21h-6.3l-4.9-6.4L5.2 21H3l7-8-7.6-10h6.4l4.4 5.8L18.9 3zm-1.1 16h1.2L7.3 5H6l11.8 14z"/></svg>`,
  facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.4c0-.9.2-1.5 1.5-1.5h1.6V4.3C16.3 4.2 15.3 4 14.2 4c-2.4 0-4 1.5-4 4.1v2.4H7.7v3h2.5V21h3.3z"/></svg>`,
  linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.9 8.4H3.6V20h3.3V8.4zM5.3 3.5a1.9 1.9 0 100 3.8 1.9 1.9 0 000-3.8zM20.4 20h-3.3v-6.1c0-1.5-.5-2.5-1.8-2.5-1 0-1.6.7-1.9 1.3-.1.2-.1.6-.1.9V20H10s.1-10.6 0-11.6h3.3v1.7c.4-.7 1.2-1.7 3-1.7 2.2 0 3.9 1.4 3.9 4.5V20z"/></svg>`,

};

function iconeSvgParaUrl(url) {
  try {
    const u = url.toLowerCase();
    if (u.includes('wa.me') || u.includes('whatsapp.com')) return ICONES_SVG.whatsapp;
    if (u.includes('instagram.com')) return ICONES_SVG.instagram;
    if (u.includes('youtube.com') || u.includes('youtu.be')) return ICONES_SVG.youtube;
    if (u.includes('tiktok.com')) return ICONES_SVG.tiktok;
    if (u.includes('twitter.com') || u.includes('x.com')) return ICONES_SVG.x;
    if (u.includes('facebook.com')) return ICONES_SVG.facebook;
    if (u.includes('linkedin.com')) return ICONES_SVG.linkedin;
    if (u.includes('github.com')) return ICONES_SVG.github;
    if (u.includes('t.me') || u.includes('telegram.')) return ICONES_SVG.telegram;
    if (u.includes('spotify.com')) return ICONES_SVG.spotify;
    if (u.startsWith('mailto:')) return ICONES_SVG.email;
    return ICONES_SVG.link;
  } catch (e) {
    return ICONES_SVG.link;
  }
}

function aplicarCorTema(hex) {
  document.documentElement.style.setProperty('--accent', hex || '#FF4F32');
}

function renderEstadoVazio() {
  cardEl.innerHTML = `
    <div class="state-box">
      <div class="big">nenhum @ informado</div>
      acesse pelo formato who.editoramindwave.com.br/seu-slug
    </div>`;
}

function renderErro(msg) {
  cardEl.innerHTML = `
    <div class="state-box">
      <div class="big">registro não encontrado</div>
      ${msg || 'esse @ ainda não existe na base'}
    </div>`;
}

function renderBlocoLeitura(bloco) {
  if (bloco.tipo === 'texto') {
    return `<div class="texto-bloco">${bloco.conteudo}</div>`;
  }
  const icone = iconeSvgParaUrl(bloco.url);
  return `
    <a class="link-row" href="${bloco.url}" target="_blank" rel="noopener">
      <span class="label"><span class="icone">${icone}</span>${bloco.titulo}</span>
      <span class="arrow">→</span>
    </a>`;
}

function configurarBotaoCurtir(pagina) {
  const chave = 'curtiu:' + pagina.slug;
  const jaCurtiu = localStorage.getItem(chave) === '1';
  const btn = document.getElementById('btnCurtir');
  const contador = document.getElementById('curtirContador');
  const coracaoVazio = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9C.4 8.6 2 4 6.3 4 9 4 11 6 12 7.5 13 6 15 4 17.7 4 22 4 23.6 8.6 22 12c-2.5 4.4-10 9-10 9z"/></svg>`;
  const coracaoCheio = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9C.4 8.6 2 4 6.3 4 9 4 11 6 12 7.5 13 6 15 4 17.7 4 22 4 23.6 8.6 22 12c-2.5 4.4-10 9-10 9z"/></svg>`;

  if (jaCurtiu) btn.classList.add('curtido');
  btn.querySelector('.icone-coracao').innerHTML = jaCurtiu ? coracaoCheio : coracaoVazio;
  contador.textContent = pagina.likes || 0;

  btn.onclick = async () => {
    if (btn.dataset.processando === '1') return;
    if (localStorage.getItem(chave) === '1') return;

    btn.dataset.processando = '1';
    try {
      const res = await fetch(`${API_BASE}/curtir.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: pagina.slug }),
      });
      const data = await res.json();
      if (data.sucesso) {
        localStorage.setItem(chave, '1');
        btn.classList.add('curtido');
        btn.querySelector('.icone-coracao').innerHTML = coracaoCheio;
        contador.textContent = data.likes;
      }
    } catch (e) {
      // curtida é algo leve, falha silenciosa é aceitável aqui
    } finally {
      btn.dataset.processando = '0';
    }
  };
}

function renderLeitura(pagina) {
  aplicarCorTema(pagina.cor_tema);

  const blocosHtml = (pagina.blocos || []).map(renderBlocoLeitura).join('');
  const fotoHtml = pagina.foto_url
    ? `<img src="${pagina.foto_url}" alt="${pagina.titulo}">`
    : iniciais(pagina.titulo);

  cardEl.innerHTML = `
    <button class="like-btn" id="btnCurtir" type="button">
      <span class="icone-coracao"></span>
      <span id="curtirContador">0</span>
    </button>
    <div class="header-row">
      <div class="avatar">${fotoHtml}</div>
      <div class="header-text">
        <h1>${pagina.titulo}</h1>
        <div class="handle">@${pagina.slug}</div>
      </div>
    </div>
    ${pagina.bio ? `<p class="bio">${pagina.bio}</p>` : ''}
    <div class="blocos">${blocosHtml || '<span style="color:var(--graphite);font-size:14px;">nenhum conteúdo cadastrado ainda</span>'}</div>
  `;

  configurarBotaoCurtir(pagina);
}

function renderEdicao(pagina) {
  aplicarCorTema(pagina.cor_tema);

  const blocos = pagina.blocos && pagina.blocos.length ? pagina.blocos : [{tipo:'link', titulo:'', url:''}];

  cardEl.innerHTML = `
    <div class="edit-banner">✎ modo edição</div>
    <div class="handle" style="margin-bottom:14px;">@${pagina.slug}</div>
    <div class="field">
      <label>título</label>
      <input type="text" id="fTitulo" value="${pagina.titulo || ''}">
    </div>
    <div class="field">
      <label>bio (use enter para pular linha)</label>
      <textarea id="fBio" rows="3">${pagina.bio || ''}</textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>foto (url)</label>
        <input type="text" id="fFoto" value="${pagina.foto_url || ''}" placeholder="https://...">
      </div>
      <div class="field" style="max-width:70px;">
        <label>cor</label>
        <input type="color" id="fCor" value="${pagina.cor_tema || '#FF4F32'}">
      </div>
    </div>
    <div class="field">
      <label>conteúdo (links e textos, nessa ordem)</label>
      <div id="blocosEditArea"></div>
      <div class="btn-add-row">
        <button class="btn btn-add" id="btnAddLink" type="button">+ link</button>
        <button class="btn btn-add" id="btnAddTexto" type="button">+ texto</button>
      </div>
    </div>
    <button class="btn btn-save" id="btnSalvar" type="button">salvar alterações</button>
    <div class="save-msg" id="saveMsg"></div>
  `;

  const blocosArea = document.getElementById('blocosEditArea');

  function addBlocoRow(tipo, dados) {
    dados = dados || {};
    const row = document.createElement('div');
    row.className = 'bloco-edit-item';
    row.dataset.tipo = tipo;

    if (tipo === 'texto') {
      row.innerHTML = `
        <div class="tipo-row">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);">texto</span>
          <button class="btn btn-remove" type="button" style="margin-left:auto;">✕</button>
        </div>
        <textarea class="bloco-conteudo" rows="2" placeholder="escreva um aviso, anúncio, etc.">${dados.conteudo || ''}</textarea>
      `;
    } else {
      row.innerHTML = `
        <div class="tipo-row">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);">link</span>
          <button class="btn btn-remove" type="button" style="margin-left:auto;">✕</button>
        </div>
        <div class="link-edit-row">
          <input type="text" placeholder="título" class="bloco-titulo" value="${dados.titulo || ''}">
          <input type="text" placeholder="url" class="bloco-url" value="${dados.url || ''}">
        </div>
      `;
    }
    row.querySelector('.btn-remove').addEventListener('click', () => row.remove());
    blocosArea.appendChild(row);
  }

  blocos.forEach(b => addBlocoRow(b.tipo || 'link', b));

  document.getElementById('btnAddLink').addEventListener('click', () => addBlocoRow('link'));
  document.getElementById('btnAddTexto').addEventListener('click', () => addBlocoRow('texto'));

  document.getElementById('btnSalvar').addEventListener('click', async () => {
    const btn = document.getElementById('btnSalvar');
    const msg = document.getElementById('saveMsg');
    btn.disabled = true;
    btn.textContent = 'salvando…';
    msg.textContent = '';
    msg.className = 'save-msg';

    const novosBlocos = Array.from(blocosArea.querySelectorAll('.bloco-edit-item'))
      .map(row => {
        if (row.dataset.tipo === 'texto') {
          const conteudo = row.querySelector('.bloco-conteudo').value.trim();
          return conteudo ? { tipo: 'texto', conteudo } : null;
        }
        const titulo = row.querySelector('.bloco-titulo').value.trim();
        const url = row.querySelector('.bloco-url').value.trim();
        return (titulo && url) ? { tipo: 'link', titulo, url } : null;
      })
      .filter(Boolean);

    const payload = {
      slug,
      token,
      titulo: document.getElementById('fTitulo').value.trim(),
      bio: document.getElementById('fBio').value.trim(),
      foto_url: document.getElementById('fFoto').value.trim(),
      cor_tema: document.getElementById('fCor').value,
      blocos: novosBlocos,
    };

    try {
      const res = await fetch(`${API_BASE}/salvar.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.sucesso) {
        msg.textContent = '✓ alterações salvas';
        msg.classList.add('ok');
        aplicarCorTema(payload.cor_tema);
      } else {
        msg.textContent = data.erro || 'não foi possível salvar';
        msg.classList.add('err');
      }
    } catch (e) {
      msg.textContent = 'erro de conexão com a api';
      msg.classList.add('err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'salvar alterações';
    }
  });
}

async function iniciar() {
  if (!slug) {
    renderEstadoVazio();
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/buscar.php?slug=${encodeURIComponent(slug)}`);
    const data = await res.json();

    if (!data.sucesso) {
      renderErro(data.erro);
      return;
    }

    if (token) {
      renderEdicao(data.pagina);
    } else {
      renderLeitura(data.pagina);
    }
  } catch (e) {
    renderErro('não foi possível conectar à api. tenta de novo em instantes.');
  }
}

iniciar();
</script>
</body>
</html>
